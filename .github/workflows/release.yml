name: release

# Tag v* -> build with the restored cache. Stand-in for the DocSynth
# release workflow; it validates that a TAG run restores the cache that
# deps.yml saved on MAIN (the cross-ref case that was broken).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      # read, not readwrite: this job must never compile or save deps.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,read
    steps:
      - uses: actions/checkout@v4

      # Restore only. On a miss the job fails here, in seconds.
      # Recovery: gh workflow run deps.yml, wait for green, re-run this.
      - name: Restore vcpkg binary cache (deps.yml populates it)
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-
          restore-keys: |
            vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}-
          fail-on-cache-miss: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Pin vcpkg root (msvc-dev-cmd exports the read-only VS-bundled one)
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "VCPKG_ROOT=C:/vcpkg"

      - name: Fetch vcpkg history (the builtin-baseline pin may postdate the runner image)
        shell: pwsh
        run: git -C C:/vcpkg fetch origin

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Package (stand-in for the NSIS step)
        shell: pwsh
        run: .\build\cilab.exe
